<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>TRT Tracker</title><style>:root{color-scheme:dark;--bg:#080b11;--card:#111722;--muted:#8e9aaa;--text:#f5f7fa;--accent:#62a8ff;--line:#202938}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}header{padding:24px 4px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 14px}.sub,.small{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.next{background:linear-gradient(145deg,#15243a,#101722)}.label{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted)}.nextsite{font-size:24px;font-weight:700;margin:6px 0}.count{font-size:15px;color:var(--accent);margin-bottom:16px}button{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--accent);color:#07111e;width:100%;cursor:pointer}button.secondary{background:#1b2432;color:var(--text);border:1px solid #2a3547}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0c1119;border:1px solid var(--line);border-radius:14px;padding:13px}.stat b{display:block;font-size:18px;margin-top:4px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.badge{padding:5px 9px;border-radius:99px;background:#18283b;color:#9fc9ff;font-size:12px}nav{position:sticky;bottom:0;background:#080b11ee;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}nav button{background:transparent;color:var(--muted);padding:10px}.active{color:var(--text)}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1018;color:var(--text);font-size:15px;margin-top:6px}label{font-size:12px;color:var(--muted);display:block;margin-top:12px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:end;z-index:5}.sheet{background:#101620;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto;max-height:90vh;overflow:auto}</style></head><body><div class="app"><header><div><div class="sub">PERSONAL HEALTH LOG</div><h1>TRT Tracker</h1></div><span class="badge">Offline</span></header><main id="app"></main><nav><button id="homeBtn" class="active">Home</button><button id="historyBtn">History</button><button id="settingsBtn">Settings</button></nav></div><div class="modal" id="modal"><div class="sheet"><h2>Log Injection</h2><form id="injForm"><label>Date & time<input id="injDate" type="datetime-local" required></label><label>Injection site<select id="site"><option>Right Shoulder</option><option>Left Shoulder</option><option>Right Thigh</option><option>Left Thigh</option><option>Glute</option><option>Other</option></select></label><label>Dose (mg)<input id="dose" type="number" step="0.1" value="100" required></label><label>Volume (mL)<input id="volume" type="number" step="0.01" value="0.50" required></label><label>Notes<input id="notes" placeholder="Optional"></label><div class="grid" style="margin-top:16px"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save Injection</button></div></form></div></div><script>
const KEY="trtTrackerDataV1";const defaults={dosePerInjection:100,volumePerInjection:.5,weeklyDose:200,logs:[],labs:[]};let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function fmtDate(d){return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}).format(d)}function fmtTime(d){return new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(d)}function nextInjection(){let now=new Date(),day=now.getDay(),a=[];[0,3].forEach(t=>{let x=new Date(now),diff=(t-day+7)%7;x.setDate(now.getDate()+diff);x.setHours(9,0,0,0);if(x<=now)x.setDate(x.getDate()+7);a.push(x)});return a.sort((a,b)=>a-b)[0]}function nextSite(d){return d.getDay()===0?"Right Shoulder":"Left Shoulder"}function countdown(d){let ms=d-new Date();if(ms<0)return"Due now";let h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>=24?`${Math.floor(h/24)}d ${h%24}h`:`${h}h ${m}m`}function home(){let n=nextInjection(),last=data.logs[0];$("app").innerHTML=`<section class="card next"><div class="label">Next injection</div><div class="nextsite">${nextSite(n)}</div><div class="sub">${fmtDate(n)} • ${fmtTime(n)}</div><div class="count">${countdown(n)}</div><button id="logNow">💉 Log Injection</button></section><section class="card"><h2>This week</h2><div class="grid"><div class="stat"><div class="label">Weekly dose</div><b>${data.weeklyDose} mg</b></div><div class="stat"><div class="label">Per injection</div><b>${data.dosePerInjection} mg</b></div></div></section><section class="card"><h2>Last injection</h2>${last?`<div class="row"><div><b>${last.site}</b><div class="small">${fmtDate(new Date(last.date))} • ${fmtTime(new Date(last.date))}</div></div><div><b>${last.dose} mg</b><div class="small">${last.volume} mL</div></div></div>`:`<div class="small">No injections logged yet.</div>`}</section>`;$("logNow").onclick=openModal}function history(){let rows=data.logs.map(x=>`<div class="row"><div><b>${x.site}</b><div class="small">${fmtDate(new Date(x.date))} • ${fmtTime(new Date(x.date))}</div>${x.notes?`<div class="small">${x.notes}</div>`:""}</div><div style="text-align:right"><b>${x.dose} mg</b><div class="small">${x.volume} mL</div></div></div>`).join("");$("app").innerHTML=`<section class="card"><h2>Injection history</h2>${rows||'<div class="small">Your logged injections will appear here.</div>'}</section><section class="card"><h2>Labs</h2><button id="addLab">＋ Add Lab Result</button><div id="labs">${data.labs.map(l=>`<div class="row"><div><b>${l.name}</b><div class="small">${l.date}</div></div><div><b>${l.value}</b> ${l.unit}</div></div>`).join("")}</div></section>`;$("addLab").onclick=addLab}function addLab(){let name=prompt("Lab name (e.g. Testosterone)");if(!name)return;let value=prompt("Result");if(value===null)return;let unit=prompt("Unit (optional)")||"";data.labs.unshift({name,value,unit,date:fmtDate(new Date())});save();history()}function settings(){$("app").innerHTML=`<section class="card"><h2>Injection settings</h2><label>Dose per injection (mg)<input id="sDose" type="number" value="${data.dosePerInjection}"></label><label>Volume per injection (mL)<input id="sVol" type="number" step=".01" value="${data.volumePerInjection}"></label><label>Weekly dose (mg)<input id="sWeek" type="number" value="${data.weeklyDose}"></label><button id="saveSettings" style="margin-top:16px">Save Settings</button></section><section class="card"><h2>Schedule</h2><div class="row"><span>Sunday</span><span class="badge">Right Shoulder</span></div><div class="row"><span>Wednesday</span><span class="badge">Left Shoulder</span></div></section><section class="card"><h2>Data</h2><button class="secondary" id="export">Export Backup</button><button class="secondary" id="reset" style="margin-top:10px">Reset All Data</button></section>`;$("saveSettings").onclick=()=>{data.dosePerInjection=+$('sDose').value;data.volumePerInjection=+$('sVol').value;data.weeklyDose=+$('sWeek').value;save();home()};$("export").onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="trt-tracker-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("reset").onclick=()=>{if(confirm("Delete all TRT Tracker data?")){data={...defaults};save();settings()}}}function openModal(){let now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());$("injDate").value=now.toISOString().slice(0,16);$("dose").value=data.dosePerInjection;$("volume").value=data.volumePerInjection;$("modal").style.display="flex"}$("cancel").onclick=()=>$("modal").style.display="none";$("injForm").onsubmit=e=>{e.preventDefault();data.logs.unshift({date:new Date($("injDate").value).toISOString(),site:$("site").value,dose:+$("dose").value,volume:+$("volume").value,notes:$("notes").value});save();$("modal").style.display="none";home()};function tab(btn,fn){fn();document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));$(btn).classList.add("active")}$("homeBtn").onclick=()=>tab("homeBtn",home);$("historyBtn").onclick=()=>tab("historyBtn",history);$("settingsBtn").onclick=()=>tab("settingsBtn",settings);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});home();</script></body></html>
